<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT QK Kelas 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: 
                radial-gradient(at 40% 20%, hsla(28,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,1) 0px, transparent 50%);
            min-height: 100vh;
            background-attachment: fixed;
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            direction: rtl;
            line-height: 2;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-pop {
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .btn-pop:active {
            transform: scale(0.95);
        }
        .slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-slow {
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Data Soal berdasarkan dokumen (Sekarang dilengkapi dengan harakat/syakal).
        const QUESTIONS = [
            { id: 1, text: "غَسَلَ الوَلَدُ وَجْهَهُ", targetWord: "وَجْهَهُ", options: ["الفاعل", "المفعول به", "الجروالمجرور", "الظرف"], correct: 1 },
            { id: 2, text: "شَرِبَ الأَبُ القَهْوَةَ الدَّائِفَةَ", targetWord: "الأَبُ", options: ["الفاعل", "المفعول به", "الجروالمجرور", "الظرف"], correct: 0 },
            { id: 3, text: "فَذَهَبَتِ العَائِلَةُ إِلَى البُسْتَانِ الوَاسِعِ", targetWord: "إِلَى البُسْتَانِ", options: ["الفاعل", "المفعول به", "الجروالمجرور", "الظرف"], correct: 2 },
            { id: 4, text: "بَعْدَ ذَلِكَ، تَنَاوَلَتِ العَائِلَةُ الفُطُورَ مَعًا بِفَرَحٍ", targetWord: "بَعْدَ", options: ["الفاعل", "المفعول به", "الجروالمجرور", "الظرف"], correct: 3 },
            { id: 5, text: "دَخَلَ المُدَرِّسُ الفَصْلَ مُبْتَسِمًا", targetWord: "المُدَرِّسُ", options: ["الفاعل", "المفعول به", "الجروالمجرور", "الظرف"], correct: 0 },
            { id: 6, text: "وَأَكَلُوا فَوَاكِهَ البُسْتَانِ الطَّازِجَةَ شَاكِرِينَ اللهَ", targetWord: "شَاكِرِينَ", options: ["الحال", "المفعول لأجله", "المفعول المطلق", "المستثنى"], correct: 0 },
            { id: 7, text: "ثُمَّ يَجْلِسُ لِيَقْرَأَ القُرْآنَ ابْتِغَاءَ مَرْضَاتِ اللهِ", targetWord: "ابْتِغَاءَ", options: ["الحال", "المفعول لأجله", "المفعول المطلق", "المستثنى"], correct: 1 },
            { id: 8, text: "اشْتَاقَ عُمَرُ إِلَى جَدِّهِ اشْتِيَاقًا شَدِيدًا", targetWord: "اشْتِيَاقًا", options: ["الحال", "المفعول لأجله", "المفعول المطلق", "المستثنى"], correct: 2 },
            { id: 9, text: "ثُمَّ شَرِبَ الأَوْلَادُ العَصِيرَ مِنَ الكَأْسِ إِلَّا عَلِيًّا", targetWord: "إِلَّا عَلِيًّا", options: ["الحال", "المفعول لأجله", "المفعول المطلق", "المستثنى"], correct: 3 },
            { id: 10, text: "فَرَأَى الأَطْفَالُ يَلْعَبُونَ فِي الرَّمْلِ ضَاحِكِينَ", targetWord: "ضَاحِكِينَ", options: ["الحال", "المفعول لأجله", "المفعول المطلق", "المستثنى"], correct: 0 },
        ];

        const { useState, useEffect } = React;

        // --- GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA ---
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0pTEE-ew-SExDfdhNkihqxVuuhFtr8X-nIHhAyOeMLxJiBRA-FIyP0szM8fQTIYgmjg/exec";

        const App = () => {
            const [screen, setScreen] = useState('login'); // login, quiz, result
            const [student, setStudent] = useState({ name: '', className: '' });
            const [currentQ, setCurrentQ] = useState(0);
            const [answers, setAnswers] = useState(new Array(QUESTIONS.length).fill(null));
            const [score, setScore] = useState(0);
            const [isSaving, setIsSaving] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            
            // Mengubah nilai awal menjadi false, agar teks gundul saat pertama kali soal dibuka
            const [showSyakal, setShowSyakal] = useState(false); 

            // Fungsi untuk menghapus harakat (tanda baca Arab) dari teks
            const stripSyakal = (text) => {
                if (!text) return "";
                // Regex ini mendeteksi semua jenis harakat Arab (Fathah, Kasrah, Dhammah, Sukun, Tasydid, Tanwin, dll)
                return text.replace(/[\u064B-\u065F\u0670]/g, '');
            };

            const handleStart = (e) => {
                e.preventDefault();
                if (!student.name.trim() || !student.className.trim()) {
                    setErrorMsg("Mohon isi Nama Lengkap dan Kelas ya! 📝");
                    return;
                }
                setErrorMsg('');
                setScreen('quiz');
            };

            const handleSelectOption = (optIndex) => {
                const newAnswers = [...answers];
                newAnswers[currentQ] = optIndex;
                setAnswers(newAnswers);
            };

            const handleNext = () => {
                if (answers[currentQ] === null) {
                    setErrorMsg("Pilih salah satu jawaban dulu yuk! 👆");
                    return;
                }
                setErrorMsg('');
                if (currentQ < QUESTIONS.length - 1) {
                    setCurrentQ(currentQ + 1);
                } else {
                    finishQuiz();
                }
            };

            const handlePrev = () => {
                if (currentQ > 0) setCurrentQ(currentQ - 1);
                setErrorMsg('');
            };

            const finishQuiz = async () => {
                setIsSaving(true);
                let finalScore = 0;
                answers.forEach((ans, idx) => {
                    if (ans === QUESTIONS[idx].correct) {
                        finalScore += 10; // 10 soal, masing-masing 10 poin
                    }
                });
                setScore(finalScore);

                // Menyiapkan data untuk dikirim ke Google Sheets
                const formData = new FormData();
                formData.append("nama", student.name);
                formData.append("kelas", student.className);
                formData.append("nilai", finalScore);
                
                // Masukkan rincian jawaban untuk 10 soal
                answers.forEach((ans, idx) => {
                    const ansText = ans !== null && ans !== undefined ? QUESTIONS[idx].options[ans] : "Tidak dijawab";
                    formData.append(`soal_${idx + 1}`, ansText);
                });

                try {
                    // Kirim form data langsung ke URL Web App Google Apps Script Anda
                    await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors' // Penting agar data tetap terkirim meski ada blokir CORS browser
                    });
                } catch (err) {
                    console.error("Gagal mengirim ke spreadsheet:", err);
                }

                setIsSaving(false);
                setScreen('result');
            };

            if (screen === 'login') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4 relative">
                        <div className="glass-card w-full max-w-md p-8 slide-in relative z-10 border-4 border-white">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4 pulse-slow">📚</div>
                                <h1 className="text-3xl font-extrabold text-indigo-800 mb-2">Latihan Soal QK</h1>
                                <p className="text-gray-600 font-semibold">Kelas 11 - Qawaid Bahasa Arab</p>
                            </div>

                            {errorMsg && (
                                <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-6 rounded text-sm font-bold animate-bounce">
                                    {errorMsg}
                                </div>
                            )}

                            <form onSubmit={handleStart} className="space-y-5">
                                <div>
                                    <label className="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap Santri</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fa-solid fa-user text-indigo-400"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            className="w-full pl-10 pr-3 py-3 rounded-xl border-2 border-indigo-200 focus:outline-none focus:border-indigo-500 transition-colors shadow-sm"
                                            placeholder="Masukkan nama lengkap..."
                                            value={student.name}
                                            onChange={(e) => setStudent({...student, name: e.target.value})}
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-gray-700 text-sm font-bold mb-2">Kelas</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fa-solid fa-graduation-cap text-indigo-400"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            className="w-full pl-10 pr-3 py-3 rounded-xl border-2 border-indigo-200 focus:outline-none focus:border-indigo-500 transition-colors shadow-sm"
                                            placeholder="Contoh: 11 IPA 1"
                                            value={student.className}
                                            onChange={(e) => setStudent({...student, className: e.target.value})}
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl btn-pop flex items-center justify-center text-lg mt-4">
                                    Mulai Ujian <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (screen === 'quiz') {
                const question = QUESTIONS[currentQ];
                const progress = ((currentQ + 1) / QUESTIONS.length) * 100;
                
                // Tentukan teks yang akan ditampilkan (dengan atau tanpa harakat)
                const displaySentence = showSyakal ? question.text : stripSyakal(question.text);
                const displayTarget = showSyakal ? question.targetWord : stripSyakal(question.targetWord);

                return (
                    <div className="max-w-2xl mx-auto min-h-screen p-4 flex flex-col justify-center">
                        <div className="glass-card p-6 md:p-8 slide-in border-4 border-white">
                            
                            {/* Header & Progress */}
                            <div className="flex flex-wrap gap-3 justify-between items-center mb-6">
                                <div className="flex flex-wrap gap-2">
                                    <div className="text-sm font-bold text-gray-500 bg-white px-3 py-1.5 rounded-full shadow-sm border border-gray-100 flex items-center">
                                        <i className="fa-solid fa-user-circle text-indigo-500 mr-2"></i> {student.name}
                                    </div>
                                    <button 
                                        onClick={() => setShowSyakal(!showSyakal)}
                                        className={`text-sm font-bold px-3 py-1.5 rounded-full shadow-sm border transition-colors flex items-center ${showSyakal ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-500'}`}
                                    >
                                        <i className={`fa-solid ${showSyakal ? 'fa-toggle-on text-indigo-500' : 'fa-toggle-off text-gray-400'} text-lg mr-2`}></i>
                                        Syakal
                                    </button>
                                </div>
                                <div className="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-100">
                                    Soal {currentQ + 1} / {QUESTIONS.length}
                                </div>
                            </div>
                            
                            <div className="w-full bg-gray-200 rounded-full h-2.5 mb-8 overflow-hidden">
                                <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-500" style={{width: `${progress}%`}}></div>
                            </div>

                            {/* Soal */}
                            <div className="mb-8 text-center bg-white p-6 rounded-2xl shadow-sm border border-indigo-50">
                                <h2 className="text-3xl md:text-4xl arabic-text font-bold text-gray-800 mb-6">{displaySentence}</h2>
                                <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 inline-block shadow-sm">
                                    <p className="text-indigo-900 font-semibold text-base md:text-lg flex flex-col md:flex-row items-center justify-center gap-2">
                                        <span>Tentukan kedudukan kata</span>
                                        <span className="arabic-text text-2xl font-extrabold text-purple-700 bg-purple-100 px-3 py-1 rounded-lg">"{displayTarget}"</span> 
                                        <span>pada kalimat di atas!</span>
                                    </p>
                                </div>
                            </div>

                            {errorMsg && (
                                <div className="text-red-500 text-center mb-4 font-bold text-sm bg-red-50 py-2 rounded-lg">
                                    <i className="fa-solid fa-circle-exclamation"></i> {errorMsg}
                                </div>
                            )}

                            {/* Pilihan Jawaban */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                {question.options.map((opt, idx) => {
                                    const isSelected = answers[currentQ] === idx;
                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => handleSelectOption(idx)}
                                            className={`p-4 rounded-xl text-xl arabic-text font-bold transition-all btn-pop border-2 flex items-center justify-between ${
                                                isSelected 
                                                ? 'bg-indigo-500 text-white border-indigo-600 shadow-md transform scale-[1.02]' 
                                                : 'bg-white text-gray-700 border-gray-200 hover:border-indigo-300 hover:bg-indigo-50'
                                            }`}
                                        >
                                            <span>{opt}</span>
                                            {isSelected && <i className="fa-solid fa-check-circle text-white"></i>}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Navigasi */}
                            <div className="flex justify-between mt-4">
                                <button 
                                    onClick={handlePrev}
                                    disabled={currentQ === 0}
                                    className={`px-6 py-3 rounded-xl font-bold flex items-center transition-colors ${
                                        currentQ === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 btn-pop'
                                    }`}
                                >
                                    <i className="fa-solid fa-arrow-left mr-2"></i> Kembali
                                </button>
                                
                                <button 
                                    onClick={handleNext}
                                    disabled={isSaving}
                                    className="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-xl font-bold flex items-center shadow-md btn-pop transition-colors"
                                >
                                    {isSaving ? (
                                        <span>Menyimpan... <i className="fa-solid fa-spinner fa-spin ml-2"></i></span>
                                    ) : (
                                        currentQ === QUESTIONS.length - 1 ? (
                                            <span>Selesai <i className="fa-solid fa-check ml-2"></i></span>
                                        ) : (
                                            <span>Selanjutnya <i className="fa-solid fa-arrow-right ml-2"></i></span>
                                        )
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'result') {
                const isPassed = score >= 70;
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="glass-card w-full max-w-md p-10 text-center slide-in border-4 border-white">
                            <div className="text-6xl mb-6">
                                {isPassed ? '🎉' : '💪'}
                            </div>
                            <h2 className="text-3xl font-extrabold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6 font-semibold">Kerja bagus, {student.name} dari kelas {student.className}!</p>
                            
                            <div className={`p-6 rounded-3xl mb-8 border-4 shadow-inner ${isPassed ? 'bg-green-50 border-green-200' : 'bg-orange-50 border-orange-200'}`}>
                                <p className="text-gray-500 font-bold mb-1 uppercase tracking-widest text-sm">Nilai Kamu</p>
                                <div className={`text-7xl font-extrabold ${isPassed ? 'text-green-600' : 'text-orange-500'} pulse-slow`}>
                                    {score}
                                </div>
                            </div>

                            <p className="text-gray-500 text-sm mb-6 bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                                <i className="fa-solid fa-cloud-arrow-up text-blue-400 mr-1"></i> Nilai kamu sudah otomatis tersimpan di sistem!
                            </p>

                            <button 
                                onClick={() => window.location.reload()}
                                className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl btn-pop shadow-lg flex items-center justify-center"
                            >
                                <i className="fa-solid fa-rotate-right mr-2"></i> Kembali ke Awal
                            </button>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
